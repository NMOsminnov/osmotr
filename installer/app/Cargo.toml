[package]
name = "osmotr-setup-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Установка «Осмотра» на iPhone — окно"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
osmotr-setup = { path = "../core" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[features]
# В выпуске (CI) «Осмотр» и ipatool зашиты в exe: OSMOTR_IPA и IPATOOL_EXE — пути к ним при сборке.
bundled = []
