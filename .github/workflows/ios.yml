# iPhone без своего Mac: облачный macOS собирает приложение, запускает на симуляторе, снимает
# экран и собирает IPA без подписи (ставится через SideStore, подпись — Apple ID человека).
name: iPhone

on:
  # IPA (выпускная сборка — самая долгая) — только по кнопке или метке версии «v…»;
  # на каждую отправку — тесты, симулятор и снимки экрана.
  workflow_dispatch:
    inputs:
      ipa:
        description: Собрать IPA для SideStore
        type: boolean
        default: true
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["shared/**", "iosApp/**", ".github/workflows/ios.yml", "gradle/**", "*.gradle.kts", "gradle.properties"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Кэш Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Память сборке (облачный Mac — 7 ГБ; Kotlin/Native в выпускной сборке прожорлив)
        run: |
          sed -i '' 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          echo "kotlin.native.jvmArgs=-Xmx4g" >> gradle.properties
      - name: Тесты общего кода (описи, поиск)
        run: ./gradlew :shared:jvmTest --no-configuration-cache
      - name: Проект Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Сборка под симулятор
        run: |
          xcodebuild -project iosApp/Osmotr.xcodeproj -scheme Osmotr -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > xcodebuild-sim.log 2>&1 \
            || { grep -E "error|e: |What went wrong|FAILED" -A3 xcodebuild-sim.log | head -80; exit 1; }
          grep -E "BUILD SUCCEEDED|BUILD SUCCESSFUL in" xcodebuild-sim.log
      - name: Запуск на симуляторе и снимки экрана
        run: |
          mkdir -p shots
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=build/sim/Build/Products/Debug-iphonesimulator/Osmotr.app
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" kg.osmotr.app
          sleep 15
          xcrun simctl io "$DEVICE" screenshot shots/01-опись.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "Osmotr"' --style compact > shots/log.txt || true
      - name: IPA без подписи (для SideStore)
        if: github.event_name == 'workflow_dispatch' && inputs.ipa || startsWith(github.ref, 'refs/tags/v')
        run: |
          xcodebuild -project iosApp/Osmotr.xcodeproj -scheme Osmotr -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > xcodebuild-ipa.log 2>&1 \
            || { grep -E "error|e: |What went wrong|FAILED|OutOfMemory|Killed" -A3 xcodebuild-ipa.log | head -80; exit 1; }
          APP=build/dev/Build/Products/Release-iphoneos/Osmotr.app
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Osmotr.ipa Payload)
          ls -la Osmotr.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-${{ github.run_number }}
          path: |
            shots/
            Osmotr.ipa
            xcodebuild-*.log
