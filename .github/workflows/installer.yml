# Установщик «Осмотра» на iPhone для Windows — один файл: IPA (собирается здесь же на macOS) и
# ipatool зашиты внутрь. Человек подключает iPhone, запускает файл — дальше программа сама.
name: Установщик iPhone

on:
  workflow_dispatch:
  push:
    branches: [installer]
    paths: ["installer/**", "shared/**", "iosApp/**", ".github/workflows/installer.yml"]

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      # IPA — по содержимому приложения: не менялось — из кэша (сборка установщика — минуты, а не 20).
      - name: IPA из кэша
        id: ipa-cache
        uses: actions/cache@v4
        with:
          path: Osmotr.ipa
          key: osmotr-ipa-${{ hashFiles('shared/src/**', 'iosApp/**', 'gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
      - uses: actions/setup-java@v4
        if: steps.ipa-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ipa-cache.outputs.cache-hit != 'true'
      - name: Кэш Kotlin/Native
        if: steps.ipa-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Память сборке (облачный Mac — 7 ГБ; выпускная сборка Kotlin/Native прожорлива)
        if: steps.ipa-cache.outputs.cache-hit != 'true'
        run: |
          sed -i '' 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          echo "kotlin.native.jvmArgs=-Xmx4g" >> gradle.properties
      - name: Проект Xcode
        if: steps.ipa-cache.outputs.cache-hit != 'true'
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: IPA без подписи (подпишет установщик Apple ID человека)
        if: steps.ipa-cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild -project iosApp/Osmotr.xcodeproj -scheme Osmotr -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > xcodebuild-ipa.log 2>&1 \
            || { grep -E "error|e: |What went wrong|FAILED|OutOfMemory|Killed" -A3 xcodebuild-ipa.log | head -80; exit 1; }
          mkdir -p ipa/Payload && cp -R build/dev/Build/Products/Release-iphoneos/Osmotr.app ipa/Payload/
          (cd ipa && zip -qry ../Osmotr.ipa Payload)
          ls -la Osmotr.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: osmotr-ipa
          path: Osmotr.ipa

  windows:
    needs: ipa
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: osmotr-ipa
          path: bundle
      - name: ipatool для Windows (LocalDevVPN из App Store)
        run: |
          curl -fsSL -o bundle/ipatool.tar.gz https://github.com/majd/ipatool/releases/download/v2.6.0/ipatool-2.6.0-windows-amd64.tar.gz
          mkdir -p bundle/ipatool && tar -xzf bundle/ipatool.tar.gz -C bundle/ipatool
          exe=$(find bundle/ipatool -name "*.exe" | head -1); cp "$exe" bundle/ipatool.exe; ls -la bundle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - name: Ядро — проверка и сборка под Windows
        working-directory: installer
        run: cargo build --release -p osmotr-setup
      - name: Окно — один exe со всем внутри
        working-directory: installer
        env:
          OSMOTR_IPA: ${{ github.workspace }}\bundle\Osmotr.ipa
          IPATOOL_EXE: ${{ github.workspace }}\bundle\ipatool.exe
        run: |
          cargo build --release -p osmotr-setup-app --features bundled
          mkdir -p ../out && cp target/release/osmotr-setup-app.exe "../out/Установка Осмотра.exe"
          cp target/release/osmotr-setup-cli.exe ../out/osmotr-setup-cli.exe
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: out/
