# Проект Xcode для iPhone — описанием (XcodeGen собирает .xcodeproj на macOS, в CI).
name: Osmotr
options:
  bundleIdPrefix: kg.osmotr
  deploymentTarget:
    iOS: "16.0"
targets:
  Osmotr:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Осмотр
        CFBundleShortVersionString: "3.7"
        CFBundleVersion: "14"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # «Открыть в «Осмотр»» и «Поделиться» из WhatsApp, «Файлов», почты: опись Excel.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Опись Excel
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.spreadsheetml.sheet, com.microsoft.excel.xls]
          # Фото — «Открыть в «Осмотр»» из «Файлов»: в поиск «Куда положить» (как «Поделиться»).
          - CFBundleTypeName: Фото
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        # Ссылка «osmotr://incoming» — расширение «Поделиться» открывает «Осмотр», фото ждут во «Входящих».
        CFBundleURLTypes:
          - CFBundleURLName: kg.osmotr.app
            CFBundleURLSchemes: [osmotr]
        # Поворот — как на Android с 3.4: таблицы лёжа (панель справа), всё остальное тоже.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Разрешения — по одному, когда нужны, и с честной подписью (App Review 5.1.1).
        NSCameraUsageDescription: Снимки оборудования при осмотре
        NSMicrophoneUsageDescription: Голосовые заметки к папкам и описям
        NSPhotoLibraryAddUsageDescription: Копия снимков осмотра в альбоме «Осмотры», чтобы не потерять
        # Папка приложения видна в «Файлах» («На iPhone → Осмотр») и через кабель на компьютере.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kg.osmotr.app
        MARKETING_VERSION: "3.7"
        CURRENT_PROJECT_VERSION: "14"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    dependencies:
      - target: OsmotrShare
        embed: true
    preBuildScripts:
      - name: Kotlin (общий модуль)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # «Поделиться» → «Осмотр» из WhatsApp, «Фото», любого приложения (14.10.2026): фото — во «Входящие»
  # общей папки (App Group заводит установщик, isideload), открыть «Осмотр».
  OsmotrShare:
    type: app-extension
    platform: iOS
    sources: [iosShare]
    info:
      path: iosShare/Info.plist
      properties:
        CFBundleDisplayName: Осмотр
        CFBundleShortVersionString: "3.7"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kg.osmotr.app.share
        MARKETING_VERSION: "3.7"
        CURRENT_PROJECT_VERSION: "14"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
